[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gensrt"
# Single-sourced from gensrt/__init__.py so `gensrt --version`,
# GET /api/status, and the package metadata can never disagree again.
dynamic = ["version"]
description = "GPU-accelerated subtitle (SRT) generation using Whisper"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "GenSRT" }]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]

# Base dependencies.  Deliberately excludes PyTorch: GenSRT's transcription
# path is CTranslate2 (via faster-whisper) end to end, and torch was only
# ever imported to answer "is CUDA present?".  See gensrt/gpu_probe.py.
#
# A base install is fully functional on CPU, and works on GPU as soon as the
# CUDA runtime libraries are present (`pip install gensrt[cuda]`).
dependencies = [
    "faster-whisper>=1.0.3",
    "requests>=2.31.0",
    "certifi>=2024.2.2",
    "ffmpeg-python>=0.2.0",
    "srt>=3.5.3",
    "flask>=3.1.3",
    "pywebview>=5.3",
    "tqdm>=4.65.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
# GPU acceleration for CTranslate2.  These are the libraries faster-whisper
# actually needs on an NVIDIA machine; they used to arrive as a side effect
# of installing PyTorch's CUDA build, at roughly 3x the download.
cuda = [
    "nvidia-cublas-cu12>=12.4",
    "nvidia-cudnn-cu12>=9.0,<10",
    "nvidia-cuda-runtime-cu12>=12.4",
]

dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
gensrt = "gensrt.cli:main"

[tool.setuptools.dynamic]
version = { attr = "gensrt.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["gensrt*"]

[tool.setuptools.package-data]
gensrt = [
    "static/*",
    "templates/*",
    "templates/js/*",
    "bin/*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
