name: Feature request
description: Suggest a new feature, capability, or improvement for GenSRT.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest something.  The more context you
        give about the problem you're trying to solve, the better — feature
        requests grounded in real workflow needs are easier to prioritize.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: |
        Describe the underlying need, not just the proposed solution.  This helps
        us think about whether there's a better way to address it than what you
        first imagined.
      placeholder: |
        e.g. "I subtitle podcasts with multiple speakers and have to manually
        label each speaker.  Currently GenSRT outputs all cues without speaker
        labels, so I rebuild that information by hand."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like GenSRT to do?
      description: Your proposed feature or behavior.
      placeholder: |
        e.g. "Detect speaker changes and add speaker labels to cues
        (e.g. SPEAKER 1: ..., SPEAKER 2: ...) in a format compatible with
        common subtitle conventions."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        Other ways you've tried to solve this, other tools that do it, or
        related features that exist in GenSRT today.
      placeholder: |
        e.g. "I currently use pyannote.audio in a separate script and merge
        the results with the SRT manually."

  - type: dropdown
    id: scope
    attributes:
      label: Scope guess
      description: Your sense of how big a change this would be.  No worries if you're not sure — leave blank.
      options:
        - ""
        - "Small (a few hours of work)"
        - "Medium (a day or two)"
        - "Large (significant new subsystem)"
        - "Not sure"
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Anything else?
      description: Use cases, screenshots, mockups, references.
