# Lint and test on every push and pull request.
#
# CPU only: faster-whisper and ctranslate2 install as plain wheels on
# Linux, and the suite stubs the models, so nothing is downloaded.  ffmpeg
# comes from apt so the one real remux test runs instead of skipping.
# rapidocr pulls opencv-python (not headless), which needs libGL to import.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install ffmpeg and OpenCV's runtime libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
          pip install -e . --no-deps

      - name: Ruff
        run: ruff check gensrt tests

      - name: Tests
        run: pytest -q
